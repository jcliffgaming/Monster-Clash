const P2P={join(name){return new Promise((resolve,reject)=>{
const H={};let peer,conn=null,done=false,closed=false,myId=name;const host=PV.role==='host';
const fail=(code,message)=>{if(done)return;done=true;try{peer&&peer.destroy()}catch(e){}reject({code,message})};
const deliver=(topic,data,from,me)=>{(H[topic]||[]).slice().forEach(fn=>{try{fn({topic,data,peer:from,isMe:me,sameTab:me})}catch(e){console.error(e)}})};
const wire=c=>{conn=c;c.on('data',m=>{if(m&&typeof m.t==='string')deliver(m.t,m.d,c.peer,false)});
c.on('close',()=>{conn=null;if(!closed)deliver('ev',{k:'q'},c.peer,false)});c.on('error',()=>{})};
const room={name,
emit(topic,data){return new Promise(r=>{const d=JSON.parse(JSON.stringify(data===undefined?null:data));setTimeout(()=>deliver(topic,d,myId,true),0);if(conn&&conn.open)conn.send({t:topic,d});r()})},
on(topic,fn){(H[topic]=H[topic]||[]).push(fn);return()=>{H[topic]=(H[topic]||[]).filter(f=>f!==fn)}},
leave(){closed=true;try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}return Promise.resolve()}};
peer=host?new Peer(name):new Peer();
peer.on('error',e=>{const t=e&&e.type;fail(t==='peer-unavailable'?'not_found':t==='unavailable-id'?'taken':'upstream_error',String(e&&e.message||t))});
peer.on('open',id=>{if(host){done=true;resolve(room);return}myId=id;
const c=peer.connect(name,{serialization:'json',reliable:true});
c.on('open',()=>{if(!done){done=true;wire(c);resolve(room)}});c.on('error',()=>fail('upstream_error','connection'))});
peer.on('connection',c=>{if(!host)return;if(conn&&conn.open){c.close();return}c.on('open',()=>wire(c))});
setTimeout(()=>fail('upstream_error','timeout'),12000)})}};

function pvpStartHost(){curMode='pvp';M=Object.assign({},MODES.pvp);inMenu=false;document.getElementById('menu').style.display='none';setArena();reset();
S.pvp={role:'host',glv:PV.glv||{}};S.snapT=0;PV.started=1;
const f=1+.06*((PV.gkl||1)-1);S.towers.forEach(w=>{if(w.t){w.hp*=f;w.max*=f}});
S.banner={t:2.2,s:'FRIEND BATTLE'};document.getElementById('emo').style.display='flex';
PV.room.emit('start',{to:PV.opp,mx:S.towers.map(w=>Math.round(w.max))})}
function pvpStartGuest(mx){curMode='pvp';M=Object.assign({},MODES.pvp);inMenu=false;document.getElementById('menu').style.display='none';setArena();
const d=shuffle(SV.deck),base=[[0,90,445],[0,270,445],[0,180,510,1],[1,90,115],[1,270,115],[1,180,66,1]];
S={pvp:{role:'guest',map:new Map()},units:[],fx:[],pj:[],el:[5,5],time:180,ot:0,sel:null,over:false,crowns:[0,0],mx:-1,my:-1,T:0,banner:{t:2.2,s:'FRIEND BATTLE'},
towers:base.map(([t,x,y,k],i)=>({t:1-t,x:W-x,y:H-y,hp:mx[i],max:mx[i],king:k,active:!k,r:k?26:22,fl:0})),hand:d.slice(0,4),q:d.slice(4)};
PV.started=1;lastFlag='';drawHand();document.getElementById('emo').style.display='flex'}
function pvpPlay(id,x,y){if(PV.room)PV.room.emit('play',{id,x:Math.round(W-x),y:Math.round(H-y)})}
function sendSnap(){const R=PV.room;if(!R||S.over)return;
const d={t:Math.ceil(S.time),o:S.ot,c:S.crowns,u:S.units.slice(0,110).map(x=>[x.uid,NIDX[x.id],x.x|0,x.y|0,Math.max(1,Math.round(x.hp/x.max*100)),(x.team?1:0)|(x.spw>0?2:0)|(x.fl>0?4:0)]),
w:S.towers.map(w=>Math.max(0,w.hp)|0),a:S.towers.reduce((m,w,i)=>m|(w.active?1<<i:0),0),p:S.pj.slice(0,20).map(p=>[p.x|0,p.y|0,p.team?1:0])};
while(JSON.stringify(d).length>3900&&d.u.length)d.u.pop();R.emit('snap',d)}
function applySnap(d){const mp=S.pvp.map,seen=new Set();
S.time=d.t;S.ot=d.o;S.crowns=[d.c[1],d.c[0]];
S.towers.forEach((w,i)=>{const hp=d.w[i];if(hp<w.hp)w.fl=.12;w.hp=hp;w.active=!!(d.a>>i&1)});
for(const[uid,ni,x,y,hp,f]of d.u){const id=NAMES[ni];if(!id)continue;seen.add(uid);let u=mp.get(uid);const gx=W-x,gy=H-y;
if(!u){const c=CARDS[id];u={uid,id,x:gx,y:gy,r:c.r,fly:c.fly,max:100,hp,walk:Math.random()*3,slowT:0,fl:0,spw:0};mp.set(uid,u)}
if(hp<u.hp)u.fl=.12;u.tx=gx;u.ty=gy;u.hp=hp;u.team=f&1?0:1;u.spw=f&2?.6:0;if(f&4)u.fl=.12}
for(const[k,u]of mp)if(!seen.has(k)){S.fx.push({k:'puff',x:u.x,y:u.y,t:.4,r:u.r+6});mp.delete(k)}
S.units=[...mp.values()];S.pj=d.p.map(([x,y,t])=>({x:W-x,y:H-y,col:t?'#8ac0ff':'#ff8a8a'}))}
function guestTick(dt){if(S.over||inMenu)return;S.T+=dt;S.el[0]=Math.min(10,S.el[0]+dt*((S.ot||S.time<60)?1/1.4:1/2.8));
for(const u of S.units){const dx=u.tx-u.x,dy=u.ty-u.y,k=Math.min(1,dt*12);u.x+=dx*k;u.y+=dy*k;if(Math.abs(dx)+Math.abs(dy)>1)u.walk+=dt;u.fl-=dt}
for(const w of S.towers)w.fl-=dt;for(const f of S.fx)f.t-=dt;S.fx=S.fx.filter(f=>f.t>0)}
function pvp(b){
const d=el('div','msg');d.textContent=RM?'Battle a friend live. One of you creates a match and shares the code; the other joins with it. Both of you need this page open.':'Friend battles could not load (they need an internet connection). Reload the page and try again.';b.appendChild(d);
if(!RM)return;
if(PV.code){const c=el('div','code');c.textContent=PV.code;b.appendChild(c);const st=el('div','msg');st.textContent=PV.status||'';b.appendChild(st);
const x=el('button','free off');x.textContent='Cancel';x.onclick=()=>{pvpLeave();showMenu('pvp')};b.appendChild(x);return}
if(PV.status){const st=el('div','msg');st.textContent=PV.status;b.appendChild(st)}
const cb=el('button','mode big');cb.innerHTML='<span class="mi">🎫</span><span><b>Create match</b><br><small>Get a code to share</small></span>';cb.onclick=pvpCreate;b.appendChild(cb);
const jr=el('div','qrow'),inp=el('input');inp.id='pcode';inp.maxLength=5;inp.placeholder='CODE';jr.appendChild(inp);
const jb=el('button','up');jb.textContent='Join';jb.onclick=()=>pvpJoin(inp.value);jr.appendChild(jb);b.appendChild(jr)}
let last=performance.now(),lastFlag='';
function loop(n){
const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);render();
const f=S.hand.map(id=>S.el[0]>=CARDS[id].c?1:0).join('');
if(f!==lastFlag){lastFlag=f;drawHand()}
requestAnimationFrame(loop)}
reset();showMenu('home');requestAnimationFrame(loop);
</script></body></html>
